name: Build Windows EXE

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Sửa lỗi ProtonX gọi qua server nên client chỉ cần openai (không torch).
      - name: Install dependencies
        run: pip install PyQt5 PyMuPDF Pillow "openai>=1.30" openpyxl pyinstaller

      - name: Build exe
        run: pyinstaller --onefile --windowed --name OCR36 --collect-submodules openai app.py

      # config.json / data_fields.json để CẠNH exe (không nhúng) để người dùng
      # sửa endpoint, model, trường metadata mà không cần build lại.
      - name: Stage release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release/OCR36 | Out-Null
          Copy-Item dist/OCR36.exe   release/OCR36/
          Copy-Item config.json      release/OCR36/
          Copy-Item data_fields.json release/OCR36/
          Copy-Item README.md        release/OCR36/
          Compress-Archive -Path release/OCR36/* -DestinationPath release/OCR36-windows.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OCR36-windows
          path: release/OCR36-windows.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/OCR36-windows.zip
